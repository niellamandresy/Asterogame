<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/hub.css">
    <link href="./assets/fonts/font.css" rel="stylesheet" />
    <title>Asterogame</title>
</head>
<body>
    <main class="big-bloc">
        <section class="hero-copy">
            <p class="system-label">SOE // ASTROMETRY</p>
            <h1>Astero</h1>
            <div class="orange-band">
                <span></span>
                <strong>Asterogame</strong>
            </div>
        </section>

        <nav class="button-bloc" aria-label="Menu principal">
            <button type="button" class="btn btn-primary" id="begin-button">
                <span>Commencer</span>
            </button>
            <button type="button" class="btn btn-primary" id="high-scores-button">
                <span>Meilleurs scores</span>
            </button>
            <button type="button" class="btn btn-secondary" id="quit-button">Quitter</button>
        </nav>
    </main>
    <script src="./scripts/hub.js"></script>
</body>
</html>
